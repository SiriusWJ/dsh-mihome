# dsh-mihome bundle patch (declared by the `dsh.bundle.patch` manifest
# field): applied over the dsh-base layer when this package appears in a
# profile's `dsh.profile.bundles` list.
#
# Users override these values in their own profile's cordis.patch.yml, e.g.:
#   - id: mihome
#     config:
#       mode: cloud
#       region: cn
- insert:
    - id: mihome
      name: dsh-mihome
      config:
        mode: cloud
        region: cn
        baseUrl: http://127.0.0.1:8125
        usernameEnv: MIHOME_USERNAME
        passwordEnv: MIHOME_PASSWORD
        timeoutMs: 15000
        requireApproval: true
        allowedCategories: []
        recentBufferSize: 50
