# dsh-mihome 示例配置
# 用法：把下面任意一段贴到你 profile 的 cordis.patch.yml（$DSH_HOME/profiles/<name>/cordis.patch.yml）
# 后层覆盖前层，改完重启 dsh --profile web 生效。
# 管理界面：Settings → Plugins

# ─────────────────────────────────────────────────────────────
# 推荐：扫码登录（无需账号密码写进配置）
# 1) 保持下方默认配置，重启 dsh
# 2) 打开 DSH 设置 → 米家登录 → 生成登录二维码
# 3) 米家 App 扫一扫并确认 → 会话自动保存到
#    $DSH_HOME/plugin-data/dsh-mihome/session.json
# ─────────────────────────────────────────────────────────────
- id: mihome
  config:
    region: cn            # 按账号地区：cn / de / ru / us / tw / sg / in…
    requireApproval: true
    allowedCategories: [] # 可控制类别白名单，例如 [light, outlet, climate]；留空 = 全部允许

# ─────────────────────────────────────────────────────────────
# 备选：环境变量登录（适合脚本化/CI）
#   启动：MIHOME_USERNAME=<账号> MIHOME_PASSWORD=<密码> dsh --profile web
# 扫码会话优先；会话失效时自动回退到环境变量。
# ─────────────────────────────────────────────────────────────
# - id: mihome
#   config:
#     region: cn
#     usernameEnv: MIHOME_USERNAME
#     passwordEnv: MIHOME_PASSWORD

# ─────────────────────────────────────────────────────────────
# 完全关掉审批（仅建议在可信、隔离的环境用）
# ─────────────────────────────────────────────────────────────
# - id: mihome
#   config:
#     region: cn
#     requireApproval: false
